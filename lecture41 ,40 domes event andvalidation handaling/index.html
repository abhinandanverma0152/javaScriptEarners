<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>hello Dosto</h1>



    <form action="" id="form">
        <div>
            <label for="name">Name : </label>
            <input type="text" id="username" placeholder="Enter your name">
            <span id="error-messae" style="color: red;"> </span>
        </div>
        <br>

        <div>
            <label for="email">Email : </label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <br>
        <div>
            <label for="password">Password : </label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        <br>
        <div>
            <label for="bio">Bio :</label>
            <textarea name="bio" id="bio" placeholder="Enter your bio..."></textarea>
            <p id="char-count">150 characters remaining</p>
        </div>
        <br>
        <div>
            <label for="country">Select your country :</label>

            <select name="country" id="country">
                <option value="india">India</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
            </select>
        </div>
        <div>
            <input type="checkbox" id="checkbox">
            <label for="checkbox">I agree to the terms and condition.</label>
        </div>


        <button id="btn" type="submit">Creata Account</button>
    </form>
    <script src="index.js"></script>
</body>

</html>
