<body class="bg-black relative text-white selection:bg-red-500 selection:text-white ">
    <div class=" fixed  inset-x-0  border-b border-zinc-500/50  bg-black ">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between">

            <div class="flex gap-2 items-center">
                <svg class="w-7 h-7 text-red-600 " fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v3h2.5l1.5-3H4zm4.5 0l-1.5 3h3l1.5-3H8.5zm5 0l-1.5 3h3l1.5-3h-3zm5 0l-1.5 3H20V6h-1.5zM4 11v7h16v-7H4z" />
                </svg>
                <h1>MovieHub</h1>
            </div>
            <div id="hamburger">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>

            </div>

        </div>
        <div id="options" class="hidden">hello</div>
    </div>

    <div class="pt-20 max-w-4xl mx-auto">
        <form class="mx-auto" id="movieForm" action="">
            <input id="movieInput" type="text" placeholder="Search movie title (e.g. Inception, The Matrix)...">
            <button>Search</button>
        </form>
    </div>
